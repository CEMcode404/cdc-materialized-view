version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: cdcdemo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cdcdemo
    ports:
      - "3306:3306"
    command:
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: